{{- if .Values.workergroupsController.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: {{ include "worker-group-claim-operator.name" . }}
        app.kubernetes.io/component: workergroups-controller
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    name: {{ include "worker-group-claim-operator.resourceName" (dict "suffix" "workergroups-controller-leader-election-rolebinding" "context" $) }}
    namespace: {{ .Release.Namespace }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "worker-group-claim-operator.resourceName" (dict "suffix" "workergroups-controller-leader-election-role" "context" $) }}
subjects:
    - kind: ServiceAccount
      name: {{ include "worker-group-claim-operator.resourceName" (dict "suffix" "workergroups-controller-manager" "context" $) }}
      namespace: {{ .Release.Namespace }}
{{- end }}
