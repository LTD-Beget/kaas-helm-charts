{{- if and .Values.metrics.enable .Values.workergroupsController.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: {{ include "worker-group-claim-operator.resourceName" (dict "suffix" "workergroups-controller-metrics-auth-rolebinding" "context" $) }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ include "worker-group-claim-operator.resourceName" (dict "suffix" "workergroups-controller-metrics-auth-role" "context" $) }}
subjects:
    - kind: ServiceAccount
      name: {{ include "worker-group-claim-operator.resourceName" (dict "suffix" "workergroups-controller-manager" "context" $) }}
      namespace: {{ .Release.Namespace }}
{{- end }}
