{{- if .Values.workergroupsController.enable }}
apiVersion: v1
kind: ServiceAccount
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: {{ include "worker-group-claim-operator.name" . }}
        app.kubernetes.io/component: workergroups-controller
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    name: {{ include "worker-group-claim-operator.resourceName" (dict "suffix" "workergroups-controller-manager" "context" $) }}
    namespace: {{ .Release.Namespace }}
{{- end }}
