{{- if and .Values.metrics.enable .Values.nodelabelsController.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "worker-group-claim-operator.resourceName" (dict "suffix" "node-labels-controller-metrics-reader" "context" $) }}
rules:
    - nonResourceURLs:
        - /metrics
      verbs:
        - get
{{- end }}
