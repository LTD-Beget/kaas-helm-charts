## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

companyPrefix: example

## Configure the controller manager deployments.
## The operator runs two independent controllers, each deployed separately
## and independently enabled/disabled. Each controller has its own
## ServiceAccount and RBAC, scoped to only what it needs (see
## templates/nodelabels-controller/ and templates/workergroups-controller/).
##

## Labels controller (NodeLabelPolicy reconciler)
##
nodelabelsController:
  enable: true

  replicas: 1
  image:
    repository: prorobotech/nodelabels-operator
    pullPolicy: IfNotPresent
  ## Arguments
  ##
  args:
    - --leader-elect
  ## Environment variables
  ##
  env: []
  ## Image pull secrets
  ##
  imagePullSecrets: []
  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Pod's affinity
  ##
  affinity: {}

  ## Pod's node selector
  ##
  nodeSelector: {}

  ## Pod's tolerations
  ##
  tolerations: []

## Worker groups controller (WorkerGroupClaim reconciler)
##
workergroupsController:
  enable: true

  replicas: 1

  image:
    repository: prorobotech/worker-group-claim-operator
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Environment variables
  ##
  env: []

  ## Image pull secrets
  ##
  imagePullSecrets: []

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
        type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
        drop:
            - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Pod's affinity
  ##
  affinity: {}

  ## Pod's node selector
  ##
  nodeSelector: {}

  ## Pod's tolerations
  ##
  tolerations: []
## Helper RBAC roles for managing custom resources
##
rbacHelpers:
  # Install convenience admin/editor/viewer roles for CRDs
  enable: false
## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enable: true
  # Keep CRDs when uninstalling
  keep: true
## Controller metrics endpoint.
## Enable to expose /metrics endpoint with RBAC protection.
##
metrics:
  enable: false
  port: 11043 # kube-rbac-proxy HTTPS port (external)
  internalPort: 8443 # manager internal HTTP metrics port
## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enable: false
monitoring:
  serviceScrapeConfig:
    metricRelabelConfigs: []
  enabled: false
  secureService:
    enabled: false
    issuer:
      kind: ClusterIssuer
      name: default-issuer-name
## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enable: false
## Cilium network policies for the controller manager.
##
networkPolicies:
  enabled: false
