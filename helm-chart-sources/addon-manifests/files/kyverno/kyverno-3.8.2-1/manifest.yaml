apiVersion: addons.in-cloud.io/v1alpha1
kind: AddonTemplate
metadata:
  name: kyverno
spec:
  template: |
    spec:
      chart: "kyverno"
      pluginName: helm-with-values
      repoURL: "{{ .Values.companyExternalChartRegistry }}"
      version: "3.8.2-1"
      releaseName: kyverno
      targetCluster: {{ "{{ .Values.spec.variables.cluster }}" }}
      targetNamespace: "{{ .Values.companyPrefix }}-kyverno"
      variables:
        cluster_name: {{ "{{ .Values.spec.variables.cluster }}" }}
        dependency: "False"
      valuesSources:
        - name: parameters-client
          sourceRef:
            apiVersion: v1
            kind: ConfigMap
            name: parameters-client
            namespace: {{ .Values.companyPrefix }}-system
          extract:
            - as: companyPrefix
              jsonPath: .data.companyPrefix
            - as: companyDomain
              jsonPath: .data.companyDomain
      initDependencies: []
      backend:
        finalizer: true
        type: "argocd"
        ignoreDifferences:
          - group: apiextensions.k8s.io
            kind: CustomResourceDefinition
            jsonPointers:
              - /metadata/annotations
              - /metadata/labels
        namespace: "{{ .Values.companyPrefix }}-argocd"
        project: "default"
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          managedNamespaceMetadata:
            labels:
              in-cloud.io/caBundle: approved
              in-cloud.io/clusterName: {{ "{{ .Values.spec.variables.cluster }}" }}
          syncOptions:
            - ApplyOutOfSyncOnly=true
            - CreateNamespace=true
            - ServerSideApply=true
      valuesSelectors:
        - name: default
          priority: 0
          matchLabels:
            addons.in-cloud.io/values: default
            addons.in-cloud.io/addon: kyverno
        - name: client
          priority: 90
          matchLabels:
            addons.in-cloud.io/values: client
            addons.in-cloud.io/addon: kyverno
        - name: client-custom
          priority: 93
          matchLabels:
            addons.in-cloud.io/values: {{ "{{ .Values.spec.valueLabels }}" }}
            addons.in-cloud.io/addon: kyverno-client
        - name: custom
          priority: 95
          matchLabels:
            addons.in-cloud.io/values: custom
            addons.in-cloud.io/addon: kyverno-client
        - name: immutable
          priority: 99
          matchLabels:
            addons.in-cloud.io/values: immutable
            addons.in-cloud.io/addon: kyverno
