{{- if $.Values.networkPolicies.enabled }}
---
# host to client-cp-control-plane — kubelet probe (8134, health)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-host-probe-client-control-plane-8134
spec:
  description: "kubelet probe to client-cp-control-plane :8134 (health)"
  nodeSelector: {}
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.policy.serviceaccount: client-cp-control-plane-control-plane
    toPorts:
    - ports:
      - port: "8134"
        protocol: TCP

---
# host to client-cp-control-plane — kubelet probe (20257, nested kube-controller-manager)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-host-probe-client-control-plane-20257
spec:
  description: "kubelet probe to client-cp-control-plane :20257 (nested kube-controller-manager metrics)"
  nodeSelector: {}
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.policy.serviceaccount: client-cp-control-plane-control-plane
    toPorts:
    - ports:
      - port: "20257"
        protocol: TCP

---
# host to client-cp-control-plane — kubelet probe (20259, nested kube-scheduler)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-host-probe-client-control-plane-20259
spec:
  description: "kubelet probe to client-cp-control-plane :20259 (nested kube-scheduler metrics)"
  nodeSelector: {}
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.policy.serviceaccount: client-cp-control-plane-control-plane
    toPorts:
    - ports:
      - port: "20259"
        protocol: TCP

---
# host to client-cp-control-plane — kubelet probe (26443, nested kube-apiserver)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-host-probe-client-control-plane-26443
spec:
  description: "kubelet probe to client-cp-control-plane :26443 (nested kube-apiserver)"
  nodeSelector: {}
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.policy.serviceaccount: client-cp-control-plane-control-plane
    toPorts:
    - ports:
      - port: "26443"
        protocol: TCP

---
# client-cp-control-plane to host — etcd client (2379)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-host-ingress-etcd-2379-from-client-control-plane
spec:
  description: "client-cp-control-plane to host etcd :2379"
  nodeSelector: {}
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.policy.serviceaccount: client-cp-control-plane-control-plane
    toPorts:
    - ports:
      - port: "2379"
        protocol: TCP

---
# nested kube-apiserver, опубликованный на узле (26443)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-host-ingress-client-control-plane-26443
spec:
  description: "Nested (customer) kube-apiserver :26443 exposed on the node"
  nodeSelector: {}
  ingress:
  - fromEntities:
    - world
    - cluster
    toPorts:
    - ports:
      - port: "26443"
        protocol: TCP

---
# konnectivity server для агентов клиентского кластера (8132)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-host-ingress-konnectivity-8132
spec:
  description: "konnectivity server :8132 for customer cluster agents"
  nodeSelector: {}
  ingress:
  - fromEntities:
    - world
    toPorts:
    - ports:
      - port: "8132"
        protocol: TCP

---
# host to client-cp-control-plane-control-plane — health (8134), etcd metrics (20257, 20259), nested apiserver (26443)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-host-probes-control-plane
  namespace: {{ .Release.Namespace }}
spec:
  description: "Allow kubelet probes to client-cp-control-plane-control-plane"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      k8s:io.cilium.k8s.policy.serviceaccount: client-cp-control-plane-control-plane
  ingress:
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: "8134"
        protocol: TCP
      - port: "20257"
        protocol: TCP
      - port: "20259"
        protocol: TCP
      - port: "26443"
        protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-client-cp-control-plane-to-host-2379
  namespace: {{ $.Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.policy.serviceaccount: client-cp-control-plane-control-plane
      k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }}
  egress:
  - toEntities:
    - host
    toPorts:
    - ports:
      - port: '2379'
        protocol: TCP
  description: |
    Allows egress from the client-cp-control-plane to the host-local etcd endpoint
    on 2379.

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-vmagent-to-client-cp-control-plane-20259-20257-26443
  namespace: {{ $.Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.policy.serviceaccount: client-cp-control-plane-control-plane
      k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }}
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.policy.serviceaccount: vmagent-vmagent
        k8s:io.kubernetes.pod.namespace: {{ $.Values.companyPrefix }}-vmagent
    toPorts:
    - ports:
      - port: '20259'
        protocol: TCP
      - port: '26443'
        protocol: TCP
      - port: '20257'
        protocol: TCP
  description: |
    Allows ingress from vmagent to client-cp-control-plane on 20259, 20257, 26443 for metrics collection.

