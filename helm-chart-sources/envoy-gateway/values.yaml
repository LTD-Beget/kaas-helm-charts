companyPrefix: example

gateway-helm: {}

# GatewayClass + default EnvoyProxy provisioned by this addon.
# Enabled by default: the addon ships a ready-to-use GatewayClass whose managed
# data-plane Envoy Service (the one CCM watches) is a LoadBalancer.
gatewayClass:
  enabled: true
  name: envoy-gateway

envoyProxy:
  service:
    # One of: ClusterIP | LoadBalancer | NodePort
    type: LoadBalancer
    # Stub: annotations are rendered only when provided (e.g. lb.<companyDomain>/*
    # passed from addonset default values). Empty by default.
    annotations: {}
  # Pod-level overrides for the managed data-plane Envoy fleet — the pods Envoy
  # Gateway provisions for every Gateway that uses this GatewayClass. Rendered
  # into the EnvoyProxy CR (spec.provider.kubernetes.envoyDeployment.pod).
  # Empty by default; client clusters pass tolerations + an ignore label from
  # addonset so the fleet schedules onto tainted client nodes.
  pod:
    labels: {}
    tolerations: []

# Default Gateway shipped with the addon. Creating a Gateway is what makes
# Envoy Gateway actually provision the managed Envoy fleet (Deployment + the
# LoadBalancer Service that CCM watches). HTTP-only by default — an HTTPS
# listener would need a TLS secret (cert-manager) and is intentionally left out.
gateway:
  enabled: false
  name: envoy-gateway
  # Which namespaces may attach *Routes to this Gateway: All | Same | Selector
  allowedRoutesFrom: All
  http:
    port: 80

monitoring:
  enabled: false
  type: VictoriaMetrics
  secureService:
    enabled: false
    # Create a secret containing both 'tls.crt' and 'tls.key' fields
    issuer:
      kind: ClusterIssuer
      name: default
