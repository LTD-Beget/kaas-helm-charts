{{- if .Values.gatewayClass.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gatewayClass.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Applied only after wave 0 (CRDs from gateway-helm + controller) is Healthy,
    # so the EnvoyProxy/GatewayClass CRDs are Established before these CRs apply.
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ .Values.envoyProxy.service.type }}
        {{- with .Values.envoyProxy.service.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if or .Values.envoyProxy.pod.labels .Values.envoyProxy.pod.tolerations }}
      envoyDeployment:
        pod:
          {{- with .Values.envoyProxy.pod.labels }}
          labels:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envoyProxy.pod.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      {{- with .Values.envoyProxy.autoscaling }}
      {{- if .enabled }}
      envoyHpa:
        {{- with .minReplicas }}
        minReplicas: {{ . }}
        {{- end }}
        maxReplicas: {{ required "envoyProxy.autoscaling.maxReplicas is required when envoyProxy.autoscaling.enabled is true" .maxReplicas }}
        {{- with .behavior }}
        behavior:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if or .targetCPUUtilizationPercentage .targetMemoryUtilizationPercentage }}
        metrics:
          {{- with .targetCPUUtilizationPercentage }}
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: {{ . }}
          {{- end }}
          {{- with .targetMemoryUtilizationPercentage }}
          - type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: {{ . }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ .Values.gatewayClass.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
