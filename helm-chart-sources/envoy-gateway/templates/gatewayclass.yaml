{{- if .Values.gatewayClass.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gatewayClass.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Applied only after wave 0 (CRDs from gateway-helm + controller) is Healthy,
    # so the EnvoyProxy/GatewayClass CRDs are Established before these CRs apply.
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ .Values.envoyProxy.service.type }}
        {{- with .Values.envoyProxy.service.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if or .Values.envoyProxy.pod.labels .Values.envoyProxy.pod.tolerations }}
      envoyDeployment:
        pod:
          {{- with .Values.envoyProxy.pod.labels }}
          labels:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envoyProxy.pod.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ .Values.gatewayClass.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
