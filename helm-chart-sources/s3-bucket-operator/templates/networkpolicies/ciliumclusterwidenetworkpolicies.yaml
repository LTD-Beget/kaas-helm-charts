{{- if .Values.networkPolicies.enabled }}
---
# host to s3-bucket-operator — kubelet probe (8081)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-host-probe-s3-bucket-operator-8081
spec:
  description: "Allow kubelet probes (host) to s3-bucket-operator on :8081"
  nodeSelector: {}
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.policy.serviceaccount: s3-bucket-operator-controller-manager
        k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
    toPorts:
    - ports:
      - port: '8081'
        protocol: TCP
{{- end }}
